[package]
name = "ezwinstudio/orbita"
version = "1.3.6"
description = "Orbita — company command center with database-backed sign-in"

[dependencies]
"python/python" = "^3.13.0"

[fs]
"/src" = "server"
"/public" = "public"

[[command]]
name = "script"
module = "python/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/src/app.py"]
